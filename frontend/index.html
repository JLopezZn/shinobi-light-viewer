<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shinobi Light Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <aside id="sidebar">
      <h2>Cámaras</h2>
      <button id="btn-select-all" style="width:100%;margin-bottom:6px">Seleccionar todas</button>
      <ul id="camera-list"></ul>

      <div id="period-selector">
        <h3>Período</h3>
        <input type="date" id="date-picker" />
        <div class="time-row">
          <label>Desde <input type="time" id="from-time" value="00:00" /></label>
          <label>Hasta <input type="time" id="to-time" value="23:59" /></label>
        </div>
        <button id="btn-confirm-period">Confirmar período</button>
      </div>

      <div id="speed-selector">
        <h3>Velocidad</h3>
        <div id="speed-btns">
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn" data-speed="4">4×</button>
          <button class="speed-btn" data-speed="8">8×</button>
          <button class="speed-btn" data-speed="16">16×</button>
        </div>
      </div>

      <div id="indexer-status"></div>

      <div id="db-controls">
        <button id="btn-clear-db">Limpiar DB</button>
      </div>

      <div id="gestor-section">
        <h3>Gestor Shinobi</h3>
        <div id="admin-token-form">
          <input id="admin-token" type="password" placeholder="Token admin" />
          <button id="btn-save-token" style="width:100%;margin-top:4px">Guardar token</button>
        </div>
        <div id="gestor-panel" style="display:none">
          <div id="gestor-status-row">
            <span class="gestor-label">Estado:</span>
            <span id="docker-status" class="badge badge-unknown">—</span>
          </div>
          <div id="gestor-actions">
            <button id="btn-stop">Detener</button>
            <button id="btn-start" disabled>Iniciar</button>
            <button id="btn-restart" disabled>Reiniciar</button>
          </div>
          <div id="app-update-section" style="margin-top:10px">
            <button id="btn-update-app" style="width:100%">Buscar actualizaciones</button>
            <span id="update-result" style="font-size:12px;display:none;margin-top:4px;display:block"></span>
          </div>
          <div id="branch-section" style="margin-top:10px">
            <div style="display:flex;align-items:center;gap:6px">
              <select id="branch-select" style="flex:1;font-size:12px">
                <option value="">Cargando ramas...</option>
              </select>
              <span id="branch-loading" style="display:none;font-size:11px;color:#aaa">↻</span>
            </div>
            <button id="btn-switch-branch" disabled style="width:100%;margin-top:4px">Cambiar rama</button>
          </div>
          <div id="gestor-error"></div>
        </div>
      </div>
    </aside>

    <main id="main">
      <div id="grid-container"></div>

      <div id="bottom-panel">
        <div id="playback-row">
          <button id="btn-to-start"   disabled title="Ir al inicio del rango">⏮</button>
          <button id="btn-back-30"    disabled title="Retroceder 30 s">⏪ 30s</button>
          <button id="btn-play-pause" disabled>▶ Play</button>
          <button id="btn-fwd-30"     disabled title="Avanzar 30 s">30s ⏩</button>
          <button id="btn-to-end"     disabled title="Ir al final del rango">⏭</button>
        </div>

        <div id="scrubber-wrapper">
          <div id="scrubber-toprow">
            <span id="scrubber-zoom-label"></span>
            <span id="scrubber-hint">Rueda: zoom · Shift+rueda o deslizar horizontal: desplazar · Arrastrar barra: desplazar</span>
          </div>
          <div id="scrubber">
            <div id="scrubber-left" class="scrubber-outside"></div>
            <div id="scrubber-range"></div>
            <div id="scrubber-right" class="scrubber-outside"></div>
            <div id="h-start" class="handle" title="Inicio"></div>
            <div id="h-end" class="handle" title="Fin"></div>
            <div id="h-play" class="handle handle-play" title="Posición actual"></div>
          </div>
          <div id="coverage-lanes"></div>
          <div id="scrubber-minimap">
            <div id="minimap-view"></div>
            <div id="minimap-start" class="minimap-marker"></div>
            <div id="minimap-end" class="minimap-marker"></div>
          </div>
          <div id="scrubber-labels">
            <span id="lbl-period-start"></span>
            <span id="lbl-range-start"></span>
            <span id="lbl-range-end"></span>
            <span id="lbl-period-end"></span>
          </div>
        </div>

        <div id="export-panel">
          <button id="btn-export" disabled>Exportar</button>
          <div id="export-progress-wrapper" class="hidden">
            <progress id="export-progress" value="0" max="1"></progress>
            <span id="export-pct">0%</span>
            <button id="btn-cancel-export">Cancelar</button>
          </div>
          <div id="download-links"></div>
          <div id="export-error" class="hidden"></div>
        </div>
      </div>
    </main>

  </div>
  <div id="scrubber-tooltip"></div>
  <script src="app.js"></script>
</body>
</html>
